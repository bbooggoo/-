    var isDesigner = owner && owner.role === "DESIGNER" && t.discipline && (owner.disciplines || []).indexOf(t.discipline) !== -1;
    var isAdmin = owner && owner.role === "ADMIN";
    var isNonSpec = queryNature(t) === "NON_SPEC";
    var targetRows;
    if (isNonSpec) {
      targetRows = ""; // 제원 무관 질의는 AS-IS/TO-BE 개념이 없으므로 대상 표를 만들지 않는다(아래에서 표 자체를 생략)
    } else if (t.proposedChanges && t.proposedChanges.length) {
      var tg0 = t.targets[0];
      var itemsNow = (state.sheets[tg0.sheetCode] || {}).items || [];
      targetRows = t.proposedChanges.map(function (ch) {
        return "<tr><td>" + esc(tg0.sheetCode) + "</td><td>" + esc(equipModuleFor(tg0.sheetCode, tg0.itemIdx)) + "</td><td>" + esc(ch.field) + "</td><td>" + esc((itemsNow[tg0.itemIdx] || {})[ch.field]) + '</td><td class="tobe">' + esc(ch.newValue) + "</td></tr>";
      }).join("");
    } else {
      targetRows = (t.targets || []).map(function (tg) {
        var it = (state.sheets[tg.sheetCode] || {}).items || [];
        return "<tr><td>" + esc(tg.sheetCode) + "</td><td>" + esc(equipModuleFor(tg.sheetCode, tg.itemIdx)) + "</td><td>" + esc(tg.field) + "</td><td>" + esc((it[tg.itemIdx] || {})[tg.field]) + '</td><td class="tobe">' + esc(t.toBeValue == null ? "-" : t.toBeValue) + "</td></tr>";
      }).join("");
    }
    var messages = (t.messages || []).map(function (m) {
      return '<div class="msg-bubble ' + m.role + '"><div class="m-meta">' + esc(m.authorName) + " · " + m.role + " · " + fmtTime(m.at) + "</div>" + esc(m.content) + "</div>";
    }).join("");

    var actionHtml = "";
    if (isNonSpec && t.queryType === "MANUAL" && t.status === "OPEN") {
      actionHtml = (isTech || isAdmin)
        ? renderNarrativeAnswerForm(t)
        : '<p class="gate-note">이 대공정 담당 기술팀만 답변할 수 있습니다.</p>';
    } else if (isNonSpec && t.queryType === "MANUAL" && t.status === "ANSWERED") {
      actionHtml = (isDesigner || isAdmin)
        ? renderNarrativeVerifyActions(t)
        : '<p class="gate-note">이 공종 담당 설계사만 최종검증을 할 수 있습니다.</p>';
    } else if (t.queryType === "AUTO" && t.status === "OPEN") {
      if (!(isTech || isAdmin)) {
        actionHtml = '<p class="gate-note">이 대공정 담당 기술팀만 확인할 수 있습니다.</p>';
      } else if (state.changeFormFor === t.id) {
        actionHtml = renderAutoProposeForm(t);
      } else {
        actionHtml = '<div class="btn-row">' +
          '<button class="btn primary" data-auto-approve="' + t.id + '">확인 (특이사항 없음 · TO-BE 반영)</button>' +
          '<button class="btn" data-open-change-form="' + t.id + '">값 제안 (다른 값이 맞다면)</button>' +
        "</div>";
      }
    } else if (t.queryType === "MANUAL" && t.status === "OPEN") {
      actionHtml = (isTech || isAdmin)
        ? renderOpenStageActions(t)
        : '<p class="gate-note">이 대공정 담당 기술팀만 답변할 수 있습니다.</p>';
    } else if (t.queryType === "MANUAL" && t.status === "VALUE_PROPOSED") {
      actionHtml = (isDesigner || isAdmin)
        ? '<div class="btn-row"><button class="btn primary" data-final-approve="' + t.id + '">최종 확인 (DB 반영)</button><button class="btn" data-final-reject="' + t.id + '">재질의 (다시 제안 요청)</button></div>'
        : '<p class="gate-note">이 공종 담당 설계사만 최종 확인/재질의를 요청할 수 있습니다.</p>';
    } else if (t.status === "RESOLVED" || t.status === "REJECTED") {
      actionHtml = '<p style="color:var(--ink-faint);font-size:12.5px">이 질의는 종결되었습니다 (' + QA_STATUS_LABEL[t.status] + ").</p>";
    }

    return (
      "<h2 style=\"margin-bottom:4px\">" + esc(t.title) + "</h2>" +
      '<p style="font-size:12.5px;color:var(--ink-muted);margin:0 0 12px">' + (t.queryType === "AUTO" ? "자동 질의" : "수동 질의") +
        (isNonSpec ? ' <span class="chip neutral" title="제원 DB를 바꾸지 않는 일반 문의입니다">일반(제원무관)</span>' : "") + " · " + esc(t.majorProcess) +
        (t.discipline ? " · " + disciplineName(t.discipline) : "") + ' · <span class="chip ' + QA_STATUS_CHIP[t.status] + '">' + QA_STATUS_LABEL[t.status] + "</span>" +
        (t.requeryCount > 0 ? ' <span class="chip warn">재질의 ' + t.requeryCount + "회</span>" : "") + "</p>" +
      (isNonSpec ? "" : '<div style="overflow-x:auto"><table class="target-table"><thead><tr><th>건설코드</th><th>설비모듈</th><th>필드</th><th>AS-IS</th><th>TO-BE</th></tr></thead><tbody>' + targetRows + "</tbody></table></div>") +
      (t.question ? '<div class="msg-bubble QUESTION"><div class="m-meta">' + esc(t.createdBy) + " · " + fmtTime(t.createdAt) + "</div>" + esc(t.question) + "</div>" : "") +
      '<div id="threadMsgArea" style="max-height:200px;overflow-y:auto;margin:8px 0">' + messages + "</div>" +
      '<div id="threadErrorArea"></div>' +
      actionHtml
    );
  }
  function reportThreadError(err) {
    var area = document.getElementById("threadErrorArea");
    if (!area) return;
    if (!err) { area.innerHTML = ""; return; }
    var html = '<p class="error-text">' + esc(err.error || "처리 실패") + "</p>";
    if (err.errors && err.errors.length) html += "<ul>" + err.errors.map(function (m) { return '<li class="error-text">' + esc(m) + "</li>"; }).join("") + "</ul>";
    area.innerHTML = html;
  }
  function wireQueryDetailEvents(main) {
    function on(sel, fn) { var el = main.querySelector(sel); if (el) el.onclick = fn; }
    Array.prototype.forEach.call(main.querySelectorAll("[data-auto-approve]"), function (b) { b.onclick = function () { b.disabled = true; decideAuto(b.dataset.autoApprove, true).then(render); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-quick-confirm-asis]"), function (b) {
      b.onclick = function () { b.disabled = true; quickConfirmAsIs(b.dataset.quickConfirmAsis).then(render); };
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-open-change-form]"), function (b) { b.onclick = function () { state.changeFormFor = b.dataset.openChangeForm; render(); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-cancel-change-form]"), function (b) { b.onclick = function () { state.changeFormFor = null; render(); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-submit-change]"), function (b) {
      b.onclick = function () {
        var id = b.dataset.submitChange;
        var changes = [];
        Array.prototype.forEach.call(main.querySelectorAll(".chg-input"), function (inp) {
          if (inp.value !== inp.dataset.orig) changes.push({ field: inp.dataset.field, newValue: inp.value });
        });
        b.disabled = true;
        proposeChanges(id, changes).then(function (res) {
          if (res && res.error) { reportThreadError(res); b.disabled = false; } else { render(); }
        });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-propose]"), function (b) {
      b.onclick = function () {
        var val = (document.getElementById("proposeValue").value || "").trim();
        if (!val) return;
        b.disabled = true;
        proposeValue(b.dataset.propose, val).then(function (res) {
          if (res && res.error) { reportThreadError(res); b.disabled = false; } else { render(); }
        });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-final-approve]"), function (b) { b.onclick = function () { b.disabled = true; decideFinal(b.dataset.finalApprove, true).then(render); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-final-reject]"), function (b) { b.onclick = function () { b.disabled = true; decideFinal(b.dataset.finalReject, false).then(render); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-auto-propose]"), function (b) {
      b.onclick = function () {
        var val = (document.getElementById("autoProposeValue").value || "").trim();
        if (!val) return;
        b.disabled = true;
        convertAutoToProposal(b.dataset.autoPropose, val).then(function (res) {
          if (res && res.error) { reportThreadError(res); b.disabled = false; return; }
          state.changeFormFor = null;
          if (res && res.newId) state.selectedThreadId = res.newId;
          render();
        });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-submit-narrative]"), function (b) {
      b.onclick = function () {
        var val = (document.getElementById("narrativeAnswerText").value || "").trim();
        if (!val) return;
        b.disabled = true;
        submitNarrativeAnswer(b.dataset.submitNarrative, val).then(function (res) {
          if (res && res.error) { reportThreadError(res); b.disabled = false; } else { render(); }
        });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-narrative-approve]"), function (b) { b.onclick = function () { b.disabled = true; decideNarrativeAnswer(b.dataset.narrativeApprove, true).then(render); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-narrative-reject]"), function (b) { b.onclick = function () { b.disabled = true; decideNarrativeAnswer(b.dataset.narrativeReject, false).then(render); }; });
  }

  // ===================================================================
  // 수동질의 등록 (설계사 전용) — 검증 이슈가 없어도 설계사가 먼저 대공정/건설코드/설비모듈/필드를
  // 골라 AS-IS(현재값)/TO-BE(제안값)를 채운 수동(SPEC) 질의를 새로 올릴 수 있게 한다. 대공정·건설코드·
  // 설비모듈은 대상 항목을 명확히 하기 위한 필수값이며, 셋 다 "전체"도 고를 수 있다 — 대공정=전체를
  // 고르면 그 밑 건설코드도 전체 목록에서, 설비모듈=전체를 고르면 그 조건에 맞는 항목 전부가 대상
  // 후보(matchingItems)에 오른다. 후보가 여럿이면 "대상 항목" select에서 하나만 고르거나(기존과 동일)
  // 맨 위의 "전체(일괄 적용)"를 골라 여러 항목에 같은 필드·TO-BE를 한 번에 적용하는 일괄(bulk) 질의를
  // 만들 수 있다(기존 AUTO 질의 일괄 생성·"값 제안(대상 여러 건)" 화면과 같은 targets 배열 구조를 그대로
  // 재사용한다). 제출된 질의는 그대로 OPEN 상태로 들어가 기존 상태 머신(질의응답 탭의
  // renderOpenStageActions)을 그대로 타므로, 담당 기술팀이 "AS-IS 값 유지 확인" 또는 "값 제안"으로
  // 검토를 마쳐야 최종 DB에 반영된다 — 설계사가 적은 TO-BE는 어디까지나 제안값이라 곧바로 반영되지
  // 않는다(값 제안·최종승인 등 기존 함수는 하나도 건드리지 않는다).
  // ===================================================================
  var MQ_ALL = "__ALL__"; // "전체" 선택을 나타내는 값 — 빈 문자열("선택 안 함")과 구분해야 하므로 별도 상수를 쓴다
  var MQ_MAX_BULK_TARGETS = 300; // 일괄(전체) 질의의 대상 상한 — 넘으면 상위 N건만 대상으로 삼는다
  var MQ_CODE_SELECT_LIMIT = 500; // 대공정=전체일 때 건설코드 select가 너무 길어지지 않도록 표시 상한
  var MQ_ITEM_SELECT_LIMIT = 200; // 대상 항목이 아주 많을 때 개별 선택 목록에 표시할 상한(일괄 적용 자체는 이 상한과 무관)
  function defaultManualQueryForm() { return { dept: "", code: "", module: "", itemKey: "", field: "" }; }
  // 값 배열에서 중복 없이 정렬된 목록을 뽑는다 — 대공정/건설코드/설비모듈/대분류처럼 select 옵션이나
  // 일괄 대상 요약에 쓰는 작은 목록들에 재사용한다.
  function uniqSorted(arr) {
    var seen = {}, out = [];
    arr.forEach(function (x) { if (x != null && !seen[x]) { seen[x] = true; out.push(x); } });
    return out.sort();
  }
  // "전체" 선택으로 여러 건설코드·시트에 걸친 항목을 한 번에 모아 담는다 — codeVal이 특정 코드면 그
  // 시트 하나만, MQ_ALL이면 deptVal(역시 MQ_ALL일 수 있음) 조건에 맞는 모든 시트를 모은다.
  function manualQueryItemPool(deptVal, codeVal) {

  // ===================================================================
  // 업로드 (관리자 전용) — 부분접수 누적(accumulate) 지원
  // 처음부터 100% 풀패키지 제원이 한 번에 들어오는 게 아니라, 같은 건설코드로 여러 번에 걸쳐 조금씩
  // (부분접수) 들어올 수 있다. 그래서 이미 존재하는 건설코드를 다시 업로드하면 기존 항목을 통째로
  // 덮어쓰지 않고, 새로 들어온 항목만큼 "누적"한다 — 대분류+키값(성상명/전원종류/자재명)+설비모듈이
  // 같은 항목이면 최신값으로 갱신(같은 항목의 정정으로 간주), 다르면 새 항목으로 추가한다.
  // ===================================================================
  // 항목을 구분하는 매칭 키 — 제원 DB 화면 등에서 항목을 대표하는 키(itemKeyField)에 설비모듈까지
  // 더한 것이다(같은 성상명이라도 설비모듈이 다르면 서로 다른 배관/설비이므로 별개 항목으로 본다).
  function specItemMatchKey(it) {
    var key = itemKeyField(it);
    return [it.category || "", key.value || "", it.설비모듈 || ""].join("||");
  }
  // 기존 항목 배열에 새로 들어온 항목들을 누적한다 — 매칭 키가 같으면 그 항목의 값을 새 값으로
  // 갱신(부분 필드만 온 경우를 대비해 얕은 병합), 없으면 새 항목으로 뒤에 추가한다. 항목 순서 자체는
  // (제원 DB·항목 탭이 순서에 의존하지 않으므로) 크게 중요하지 않지만, 기존 항목의 자리를 그대로
  // 유지해 버전 이력 비교가 자연스럽도록 갱신은 제자리에서, 추가는 끝에 붙인다.
  function mergeItemsAccumulate(existingItems, newItems) {
    var items = (existingItems || []).map(function (it) { return Object.assign({}, it); });
    var indexByKey = {};
    items.forEach(function (it, idx) { indexByKey[specItemMatchKey(it)] = idx; });
    var addedCount = 0, updatedCount = 0;
    (newItems || []).forEach(function (ni) {
      var key = specItemMatchKey(ni);
      if (indexByKey[key] !== undefined) {
        items[indexByKey[key]] = Object.assign({}, items[indexByKey[key]], ni);
        updatedCount++;
      } else {
        indexByKey[key] = items.length;
        items.push(Object.assign({}, ni));
        addedCount++;
      }
    });
    return { items: items, addedCount: addedCount, updatedCount: updatedCount };
  }

            '<div class="field"><label class="field-label">시트(탭) 이름 (선택)</label><input class="text" id="upSheetName" placeholder="비워두면 첫 시트"></div>' +

  function renderUploadResult() {
    if (!state.uploadResult) return "";

    if (r.newCodeCount) html += " — 신규 " + r.newCodeCount + "건";
    if (r.accumulated.length) {
      var addedTotal = r.accumulated.reduce(function (a, x) { return a + x.added; }, 0);
      var updatedTotal = r.accumulated.reduce(function (a, x) { return a + x.updated; }, 0);
      html += (r.newCodeCount ? ", " : " — ") + "기존 건설코드 " + r.accumulated.length + "건에 부분접수 누적(추가 " + addedTotal + "건 · 갱신 " + updatedTotal + "건)";
    }
    html += ": " + r.codes.map(esc).join(", ") + "</div>";
    if (r.accumulated.length) {
      html += '<ul style="margin:4px 0 0;padding-left:18px;font-size:11.5px;color:var(--ink-muted)">' +
        r.accumulated.map(function (x) { return "<li>" + esc(x.code) + " — 기존 항목은 그대로 유지, 추가 " + x.added + "건 · 갱신 " + x.updated + "건</li>"; }).join("") +
      "</ul>";
    }
    if (r.warnings.length) html += "<ul style=\"margin:0;padding-left:18px\">" + r.warnings.map(function (w) { return '<li class="upload-result-warn">' + esc(w) + "</li>"; }).join("") + "</ul>";
    html += renderWorkbookAudit(r.workbookAudit);
    html += renderUploadAudit(r.audit);
    return html;
  }
  function handleUploadSubmit() {
    var fileInput = document.getElementById("upFile");
    var file = fileInput && fileInput.files[0];
    if (!file) { state.uploadResult = { error: "엑셀 파일을 선택해 주세요." }; render(); return; }
    var defaultDept = document.getElementById("upMp").value;
    var pjtVal = document.getElementById("upPjt").value;
    var sheetLabel = (document.getElementById("upSheetName").value || "").trim();
    var codeOverride = (document.getElementById("upCodeOverride").value || "").trim().toUpperCase() || null;
    state.uploadBusy = true; state.uploadResult = null; render();
    file.arrayBuffer().then(function (buf) {
      var wb = XLSX.read(buf, { type: "array" });
      var workbookAudit = auditWorkbookIntegrity(wb);
      if (workbookAudit.any) {
        // 지침(항상 지킬 것): 숨겨진 시트/필터/깨진 수식이 있으면 값을 다 읽기 전에 먼저 알람으로 띄운다
        // (파서가 정상 처리한 것처럼 보여도 원본 워크북 자체에 문제가 있을 수 있으므로).
        var alertLines = [];
        if (workbookAudit.hiddenSheets.length) alertLines.push("숨겨진 시트: " + workbookAudit.hiddenSheets.join(", "));
        if (workbookAudit.filteredSheets.length) alertLines.push("자동 필터가 걸린 시트: " + workbookAudit.filteredSheets.join(", "));
        if (workbookAudit.hiddenRowSheets.length) alertLines.push("숨겨진 행이 있는 시트: " + workbookAudit.hiddenRowSheets.join(", "));
        if (workbookAudit.brokenFormulaCells.length) alertLines.push("깨진 수식(오류값) 셀 " + workbookAudit.brokenFormulaCount + "건: " + workbookAudit.brokenFormulaCells.slice(0, 10).join(", "));
        alert("⚠ 업로드한 엑셀 파일에서 확인이 필요한 점이 발견되었습니다:\n\n" + alertLines.join("\n") + "\n\n처리는 계속 진행되며, 자세한 내용은 업로드 결과 하단에서도 확인할 수 있습니다.");
      }
      var sheetName = (sheetLabel && wb.SheetNames.indexOf(sheetLabel) !== -1) ? sheetLabel : wb.SheetNames[0];
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: null, raw: true });
      var parsed = parseGroupedWorkbook(rows, { constructionCodeOverride: codeOverride });
      var groups = parsed.groups.map(function (g) { return Object.assign({}, g, { dept: resolveMajorProcess(g.majorProcessRaw, defaultDept, parsed.warnings, g.code) }); });
      if (groups.length > 200) { parsed.warnings.push("그룹이 너무 많아(" + groups.length + "건) 처음 200건만 반영했습니다."); groups = groups.slice(0, 200); }
      var owner = currentOwner();
      var results = [];
      // 같은 건설코드가 이미 있으면(부분접수 재업로드) 기존 항목에 새 항목을 누적하고, 없으면
      // (첫 접수) 그대로 새 제원표로 저장한다 — 두 경우 모두 saveSheetVersion이 버전을 하나 올린다.
      return Promise.all(groups.map(function (g) {
        var prevSheet = state.sheets[g.code];
        var merge = prevSheet ? mergeItemsAccumulate(prevSheet.items || [], g.items) : { items: g.items, addedCount: g.items.length, updatedCount: 0 };
        var docPatch = {
          code: g.code, dept: prevSheet ? prevSheet.dept : g.dept,
          title: (prevSheet && prevSheet.title) || (g.dept + " " + g.code),
          location: g.location || (prevSheet && prevSheet.location) || "",
          pjt: pjtVal || (prevSheet && prevSheet.pjt) || "",
          items: merge.items, uploadedBy: owner ? owner.name : "관리자", uploadedAt: nowIso(),
          applied: true, // 잘못 올려 미적용으로 돌려둔 건설코드를 올바른 내용으로 재업로드하면 자동으로 다시 적용 상태가 된다
        };
        return saveSheetVersion(g.code, docPatch, "UPLOAD").then(function () {
          results.push({ code: g.code, isNew: !prevSheet, added: merge.addedCount, updated: merge.updatedCount });
        });
      })).then(function () {
        state.uploadResult = {
          count: groups.length, warnings: parsed.warnings, codes: groups.map(function (g) { return g.code; }), audit: auditParsedGroups(groups),
          workbookAudit: workbookAudit,
          newCodeCount: results.filter(function (r) { return r.isNew; }).length,
          accumulated: results.filter(function (r) { return !r.isNew; }),
        };
      });
    }).catch(function (err) {
      state.uploadResult = { error: err && err.message ? err.message : String(err) };
    }).then(function () { state.uploadBusy = false; render(); });
  }

  // ---- 업로드된 제원표 관리(적용/미적용/삭제) — 지침(항상 지킬 것) ----
  // 관리자가 잘못된 엑셀을 올렸을 때 재접수를 받을 수 있어야 한다는 요구에 따른 기능이다.
  // - "미적용"은 값을 지우지 않는 소프트 삭제다: sheetApplied()가 false인 제원표는 sheetList()를 쓰는
  //   모든 화면(대시보드·제원 DB·SUMMARY·그래프 만들기·질의응답 대상·수동질의 등록·제원 수기입력의
  //   건설코드 목록)과 generateAutoQueries()에서 자동으로 빠진다 — 새 화면을 추가할 때도 제원표 목록을
  //   가져올 때는 항상 sheetList()(또는 sheetApplied() 필터)를 거쳐야 이 규칙이 깨지지 않는다.
  // - "삭제"는 되돌릴 수 없는 완전 삭제다(store.deleteSheet, 버전 이력까지 함께 사라진다) — 값을 보존한
  //   채로 화면에서만 빼려면 반드시 "미적용"을 먼저 권한다.
  // - 적용/미적용 전환은 데이터 내용이 바뀌는 게 아니라 상태 플래그만 바뀌는 것이므로 saveSheetVersion을
  //   거치지 않는다(버전을 올리거나 versionHistory에 스냅샷을 남기지 않는다) — store.setSheet를 직접 호출한다.
  // - 이 관리 UI(적용/미적용 버튼·삭제 버튼)는 "제원표 업로드" 탭 안에만 두고, 그 탭 자체가 이미
  //   관리자 전용으로 게이팅되어 있으므로(renderUploadPage 상단의 owner.role !== "ADMIN" 체크) 별도의
  //   권한 체크를 추가하지 않아도 관리자만 쓸 수 있다 — 이 UI를 다른 화면(제원표 상세 등)에 옮기게 되면
  //   그 화면에도 반드시 같은 관리자 게이팅을 넣어야 한다.
  function toggleSheetApplied(code) {
    var sheet = state.sheets[code];
    if (!sheet) return Promise.resolve();
    var nextApplied = !sheetApplied(sheet);
    var owner = currentOwner();
    var newDoc = Object.assign({}, sheet, {
      applied: nextApplied, appliedChangedBy: owner ? owner.name : "관리자", appliedChangedAt: nowIso(),
    });
    return store.setSheet(code, newDoc);
  }
  function deleteUploadedSheet(code) {
    if (!store.deleteSheet) return Promise.reject(new Error("이 저장소에서는 삭제를 지원하지 않습니다."));
    return store.deleteSheet(code);
  }
  var UPLOAD_MANAGE_LIMIT = 100;
  // 엑셀로 업로드된(현재 버전의 출처가 UPLOAD인) 제원표만 대상으로 한다 — 시드 데이터·기술팀 수기입력
  // 제원표는 이 관리 UI의 대상이 아니다("내가 업로드한 제원표"를 재접수하는 기능이므로). 상단 PJT
  // 선택 범위를 그대로 따르고, sheetList()와 달리 미적용 제원표도 여기서는 그대로 보여준다(관리 대상
  // 이므로 목록에서 빠지면 안 된다).
  function uploadedSheetsForManage() {
    return Object.keys(state.sheets).map(function (c) { return state.sheets[c]; })
      .filter(function (s) { return s.versionSource === "UPLOAD"; })
      .filter(function (s) { return !state.selectedPjt || s.pjt === state.selectedPjt; })
      .sort(function (a, b) { return (b.updatedAt || "").localeCompare(a.updatedAt || ""); });
  }
  function renderUploadManageSection() {
    var list = uploadedSheetsForManage();
    var shown = list.slice(0, UPLOAD_MANAGE_LIMIT);
    var rows = shown.map(function (s) {
      var applied = sheetApplied(s);
      return (
        "<tr>" +
          "<td><a class=\"code-link\" href=\"#\" data-goto-sheet-manage=\"" + esc(s.code) + "\">" + esc(s.code) + "</a> <span class=\"chip neutral\">v" + (s.ver || 1) + "</span></td>" +
          "<td><span class=\"chip dept\">" + esc(s.dept) + "</span></td>" +
          "<td>" + esc(s.title || "") + "</td>" +
          "<td class=\"muted\">" + esc(s.pjt || "") + "</td>" +
          "<td>" + (applied ? '<span class="chip ok">적용</span>' : '<span class="chip neutral">미적용</span>') + "</td>" +
          "<td class=\"muted\" style=\"font-size:11px\">" + fmtTime(s.uploadedAt || s.updatedAt) + (s.uploadedBy ? " · " + esc(s.uploadedBy) : "") + "</td>" +
          '<td><div class="btn-row">' +
            '<button class="btn small" data-toggle-applied="' + esc(s.code) + '">' + (applied ? "미적용으로 전환" : "적용으로 전환") + "</button>" +
            '<button class="btn small" style="color:var(--error);border-color:var(--error)" data-delete-sheet="' + esc(s.code) + '">삭제</button>' +
          "</div></td>" +
        "</tr>"
      );
    }).join("");
    return (
      '<div class="panel">' +
        "<h2>업로드된 제원표 관리 (관리자 전용)" + (list.length ? " — " + list.length + "건" : "") + "</h2>" +
        '<p class="lead" style="margin-top:4px">엑셀로 업로드한 제원표를 건설코드 단위로 관리합니다. 잘못 업로드했다면 <b>미적용</b>으로 돌려 대시보드·제원 DB·집계·질의 생성 등 ' +
          "모든 화면에서 즉시 제외한 뒤(값은 그대로 보존되며 언제든 다시 적용할 수 있습니다) 올바른 내용으로 같은 건설코드로 다시 업로드해 재접수하거나, " +
          "<b>삭제</b>로 완전히 지우고 처음부터 다시 올리세요. 상단 <b>PJT 선택</b> 범위를 그대로 따릅니다.</p>" +
        (shown.length
          ? '<div style="overflow-x:auto"><table class="sheet-table"><thead><tr><th>건설코드</th><th>대공정</th><th>제목</th><th>PJT</th><th>상태</th><th>업로드</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>"
          : '<div class="empty-state">엑셀로 업로드한 제원표가 아직 없습니다.</div>') +
        (list.length > UPLOAD_MANAGE_LIMIT ? '<p class="auto-note" style="margin-top:8px">최근 ' + UPLOAD_MANAGE_LIMIT + "건만 표시합니다 — PJT를 선택해 좁혀 보세요.</p>" : "") +
        '<div id="upManageMsg"></div>' +
      "</div>"
    );
  }
  function wireUploadManageEvents(main) {
    function reportManageError(msg) {
      var el = document.getElementById("upManageMsg");
      if (el) el.innerHTML = '<p class="error-text">' + esc(msg) + "</p>";
    }
    Array.prototype.forEach.call(main.querySelectorAll("[data-toggle-applied]"), function (b) {
      b.onclick = function () {
        b.disabled = true;
        toggleSheetApplied(b.dataset.toggleApplied).then(render).catch(function (e) {
          b.disabled = false;
          reportManageError("전환 실패: " + (e && e.message ? e.message : e));
        });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-delete-sheet]"), function (b) {
      withConfirmClick(b, "정말 삭제? (다시 클릭)", function () {
        var code = b.dataset.deleteSheet;
        b.disabled = true;
        deleteUploadedSheet(code).then(render).catch(function (e) {
          b.disabled = false;
          reportManageError("삭제 실패: " + (e && e.message ? e.message : e));
        });
      });
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-goto-sheet-manage]"), function (el) {
      el.addEventListener("click", function (e) { e.preventDefault(); openSheet(el.dataset.gotoSheetManage); });
    });
  }

  // ===================================================================
  // 제원 수기입력 (기술팀 담당자 전용 입력 / 건설팀 담당자 승인) — 협의된 제원 접수 양식(엑셀)이 아닌
  // 형태로 제원이 들어왔을 때, "제원표 업로드" 탭의 자동 파서를 거치지 못하므로 기술팀 담당자가 이
  // 화면에서 직접 항목을 추가/수정/삭제한다. 항목 구성(대분류별 키 필드·값 필드)은 CATEGORY_ITEM_SCHEMA로
  // 협의된 양식과 동일하게 맞춰 두어, 승인된 값도 제원 DB·제원집계·질의응답 등 다른 화면에 업로드로
  // 들어온 값과 완전히 똑같이 반영된다. 검증 규칙(성상별 유량 OVER 등)도 다른 항목과 동일하게 "검증
  // 결과" 탭에서 그대로 적용된다.
  //
  // 지침(항상 지킬 것): 기술팀이 이 화면에서 입력/수정/삭제해도 곧바로 제원 DB(state.sheets)에
  // 반영되지 않는다 — "spec_entry_requests" 컬렉션에 PENDING 요청으로만 쌓이고, 담당 대공정의
  // 건설팀 담당자(CONSTRUCTION_LEAD, 또는 ADMIN)가 승인해야만 실제로 saveSheetVersion이 호출되어
  // DB에 반영된다(applySpecEntryRequest). 관리자(ADMIN)가 직접 입력하는 경우만 예외적으로 승인 없이
  // 곧장 반영한다(specEntry*Direct를 바로 호출) — 관리자는 이미 모든 데이터를 다룰 수 있는 최상위
  // 역할이기 때문이다.
  // ===================================================================
  function specEntryUpdateItemDirect(code, itemIdx, changes) {
    var sheet = state.sheets[code];
    if (!sheet) return Promise.resolve();
    var items = (sheet.items || []).map(function (it) { return Object.assign({}, it); });
    var it = items[itemIdx];
    if (!it) return Promise.resolve();
    Object.keys(changes).forEach(function (f) { if (changes[f] == null) delete it[f]; else it[f] = changes[f]; });
    var newDoc = Object.assign({}, sheet, { items: items });
    return saveSheetVersion(code, newDoc, "MANUAL_ENTRY");
  }
  function specEntryDeleteItemDirect(code, itemIdx) {
    var sheet = state.sheets[code];
    if (!sheet) return Promise.resolve();
    var items = (sheet.items || []).slice();
    items.splice(itemIdx, 1);
    var newDoc = Object.assign({}, sheet, { items: items });
    return saveSheetVersion(code, newDoc, "MANUAL_ENTRY");
  }
  // sheetPatchBase: 기존 건설코드면 그 시트 전체(spread), 새 건설코드면 { code, dept, title, location, pjt, items: [] }
  function specEntryAddItemDirect(code, sheetPatchBase, newItem) {
    var items = (sheetPatchBase.items || []).slice();
    items.push(newItem);
    var newDoc = Object.assign({}, sheetPatchBase, { items: items });
    return saveSheetVersion(code, newDoc, "MANUAL_ENTRY");
  }
  // ---- 기술팀 담당자가 실제로 누르는 저장/삭제/추가 — DB에 곧장 반영하는 대신 승인 대기 요청을
  // spec_entry_requests에 쌓는다. beforeItem/beforeCount는 승인 화면에 "무엇이 어떻게 바뀌는지"를
  // 보여주기 위한 스냅샷일 뿐, 승인 시점에는 항상 그때의 최신 state.sheets에 다시 적용한다. ----
  function specEntryRequestUpdate(code, itemIdx, changes, owner, sheet) {
    return store.addSpecEntryRequest({
      action: "UPDATE", code: code, dept: sheet.dept, itemIdx: itemIdx, changes: changes,
      beforeItem: Object.assign({}, (sheet.items || [])[itemIdx]),
      status: "PENDING", requestedBy: owner.name, requestedById: owner.id, requestedAt: nowIso(),
    });
  }
  function specEntryRequestDelete(code, itemIdx, owner, sheet) {
    return store.addSpecEntryRequest({
      action: "DELETE", code: code, dept: sheet.dept, itemIdx: itemIdx,
      beforeItem: Object.assign({}, (sheet.items || [])[itemIdx]),
      status: "PENDING", requestedBy: owner.name, requestedById: owner.id, requestedAt: nowIso(),
    });
  }
  function specEntryRequestAdd(code, dept, sheetPatchBase, newItem, isNewCode, owner) {
    return store.addSpecEntryRequest({
      action: "ADD", code: code, dept: dept, isNewCode: !!isNewCode,
      sheetPatchBase: isNewCode ? sheetPatchBase : null, // 기존 건설코드면 승인 시점의 최신 시트를 그대로 쓰면 되므로 스냅샷이 필요 없다
      newItem: newItem,
      status: "PENDING", requestedBy: owner.name, requestedById: owner.id, requestedAt: nowIso(),
    });
  }
  // ---- 승인 대기 요청 목록에서 다루는 헬퍼들 ----
  function specEntryRequestsPending() { return state.specEntryRequests.filter(function (r) { return r.status === "PENDING"; }); }
  // 건설팀 담당자(또는 ADMIN)가 승인 화면에서 볼 수 있는 요청 — CONSTRUCTION_LEAD는 자신의 담당
  // 대공정(majorProcesses)에 해당하는 요청만, ADMIN은 전체를 본다.
  function specEntryRequestsForApprover(owner) {
    var list = specEntryRequestsPending();
    if (!owner) return [];
    if (owner.role === "ADMIN") return list;
    if (owner.role === "CONSTRUCTION_LEAD") {
      var mps = owner.majorProcesses || [];
      return list.filter(function (r) { return mps.indexOf(r.dept) !== -1; });
    }
    return [];
  }
  // 요청 한 건을 사람이 읽을 수 있는 변경 요약으로 — 승인 대기 카드/내 요청 현황 목록에 함께 쓴다.
  function specEntryRequestSummary(req) {
    if (req.action === "ADD") {
      var it = req.newItem || {};
      var keyField = (CATEGORY_ITEM_SCHEMA[it.category] || {}).keyField;
      var keyVal = keyField ? it[keyField] : "";
      return "새 항목 추가 — " + esc(it.category || "") + (keyVal ? " · " + esc(keyField) + "=" + esc(keyVal) : "") + (req.isNewCode ? " (새 건설코드)" : "");
    }
    if (req.action === "DELETE") {
      var b = req.beforeItem || {};
      return "항목 삭제 — " + esc(b.category || "") + " · " + esc(itemKeyField(b).name || "") + "=" + esc(itemKeyField(b).value == null ? "" : itemKeyField(b).value);
    }
    // UPDATE
    var before = req.beforeItem || {};
    return Object.keys(req.changes || {}).map(function (f) {
      var oldV = specEntryEffectiveValue(before, f); var newV = req.changes[f];
      return esc(f) + ": " + esc(oldV == null ? "(없음)" : oldV) + " → " + esc(newV == null ? "(삭제)" : newV);
    }).join(", ") || "변경 없음";
  }
  // 승인 — 요청 내용을 그 시점의 최신 state.sheets에 실제로 적용(saveSheetVersion 호출)한 뒤 상태를
  // APPROVED로 바꾼다. 반려 — DB에는 아무 영향 없이 상태만 REJECTED로 바꾼다.
  function approveSpecEntryRequest(req, owner) {
    var apply;
    if (req.action === "ADD") {
      var base = req.isNewCode ? req.sheetPatchBase : Object.assign({}, state.sheets[req.code]);
      apply = specEntryAddItemDirect(req.code, base, req.newItem);
    } else if (req.action === "DELETE") {
      apply = specEntryDeleteItemDirect(req.code, req.itemIdx);
    } else {
      apply = specEntryUpdateItemDirect(req.code, req.itemIdx, req.changes);
    }
    // UPDATE 승인 건은 필드별 변경 이력(corrections)도 남겨, 질의응답으로 바뀐 값과 마찬가지로
    // 제원 DB/제원표 셀에 음영 표시 + 호버 시 "언제/누가/무엇→무엇" 툴팁이 뜨게 한다.
    if (req.action === "UPDATE") {
      var before = req.beforeItem || {};
      var changedFields = Object.keys(req.changes || {});
      apply = apply.then(function () {
        return Promise.all(changedFields.map(function (f) {
          return store.addCorrection({
            sheetCode: req.code, itemIdx: req.itemIdx, field: f,
            oldValue: String(specEntryEffectiveValue(before, f) == null ? "" : specEntryEffectiveValue(before, f)),
            newValue: String(req.changes[f] == null ? "" : req.changes[f]),
            source: "MANUAL_ENTRY", threadId: null, appliedBy: owner.name, appliedAt: nowIso(),
          });
        }));
      });
    }
    return apply.then(function () {
      return store.updateSpecEntryRequest(req.id, { status: "APPROVED", decidedBy: owner.name, decidedAt: nowIso() });
    });
  }
  function rejectSpecEntryRequest(req, owner, note) {
    return store.updateSpecEntryRequest(req.id, { status: "REJECTED", decidedBy: owner.name, decidedAt: nowIso(), decisionNote: note || "" });
  }
  function cancelSpecEntryRequest(req) {
    return store.updateSpecEntryRequest(req.id, { status: "CANCELLED" });
  }
  // 기술팀 담당자가 이미 승인된 수정/삭제 요청을 원래 값으로 되돌리고 싶을 때 — 되돌리기도 곧장
  // DB에 반영하지 않고 새로운 승인 요청(UPDATE 요청이면 이전 값으로 되돌리는 UPDATE 요청, DELETE
  // 요청이면 항목을 다시 살리는 ADD 요청)으로 접수해, 다른 요청과 마찬가지로 건설팀 담당자의
  // 승인을 거치게 한다.
  function requestRevertSpecEntry(req, owner) {
    var sheet = state.sheets[req.code];
    if (!sheet) return Promise.reject(new Error("대상 건설코드(" + req.code + ")를 찾을 수 없습니다."));
    if (req.action === "UPDATE") {
      var before = req.beforeItem || {};
      var revertChanges = {};
      Object.keys(req.changes || {}).forEach(function (f) {
        revertChanges[f] = f === "설비대수" ? specEntryEffectiveValue(before, f)
          : Object.prototype.hasOwnProperty.call(before, f) ? before[f] : null;
      });
      return specEntryRequestUpdate(req.code, req.itemIdx, revertChanges, owner, sheet);
    }
    if (req.action === "DELETE") {
      return specEntryRequestAdd(req.code, sheet.dept, null, Object.assign({}, req.beforeItem), false, owner);
    }
    return Promise.reject(new Error("이 요청 유형은 복원 요청을 지원하지 않습니다."));
  }
  // 설비대수는 값이 아예 없으면(설비대수 열이 없던 옛 데이터) 1대로 취급하는 게 제원집계 로직의
  // 기본값과 같다 — "이전 값과 비교"·"이전 값 표시"를 하는 모든 곳에서 이 기준을 함께 쓴다.
  function specEntryEffectiveValue(it, f) {
    return (f === "설비대수" && (it || {})[f] == null) ? 1 : (it || {})[f];
  }
  // 폼에서 읽은 값(vals) 전체가 아니라, 실제로 원래 값과 달라진 필드만 "변경"으로 남긴다 — 그래야
  // 승인 요청 요약(specEntryRequestSummary)도 실제로 바꾼 값만 보여준다(건드리지 않은 필드까지
  // "값 → 같은 값"으로 나열되는 문제를 막는다).
  function specEntryDiffChanges(currentItem, vals) {
    var changes = {};
    Object.keys(vals).forEach(function (f) {
      if (vals[f] !== specEntryEffectiveValue(currentItem, f)) changes[f] = vals[f];
    });
    return changes;
  }
  function readSpecEntryInputs(scopeEl) {
    var vals = {};
    Array.prototype.forEach.call(scopeEl.querySelectorAll(".se-input"), function (el) {
      var f = el.dataset.field;
      var v = (el.value || "").trim();
      vals[f] = v === "" ? null : coerceValue(v);
    });
    return vals;
  }
  // 승인 대기 요청 카드 — mode: "review"(승인/반려 버튼) · "mine"(취소 버튼) · "none"(버튼 없음, 이력 표시용)
  function renderSpecEntryRequestCard(req, mode) {
    var chip = req.status === "PENDING" ? '<span class="chip warn">대기중</span>'
      : req.status === "APPROVED" ? '<span class="chip ok">승인됨</span>'
      : req.status === "REJECTED" ? '<span class="chip error">반려됨</span>'
      : '<span class="chip neutral">취소됨</span>';
    var meta = esc(req.code) + " · " + esc(req.dept) + " · " + fmtTime(req.requestedAt) + " · " + esc(req.requestedBy);
    var decided = req.decidedAt
      ? '<div style="font-size:11.5px;color:var(--ink-muted);margin-top:2px">' + (req.status === "APPROVED" ? "승인" : "반려") + ": " + esc(req.decidedBy) + " · " + fmtTime(req.decidedAt) + (req.decisionNote ? " · " + esc(req.decisionNote) : "") + "</div>"
      : "";
    var actions = "";
    if (mode === "review" && req.status === "PENDING") {
      actions = '<div class="btn-row" style="margin-top:6px">' +
        '<button class="btn small primary" data-ser-approve="' + req.id + '">승인 (DB 반영)</button>' +
        '<button class="btn small" data-ser-reject="' + req.id + '">반려</button>' +
      "</div>";
    } else if (mode === "mine" && req.status === "PENDING") {
      actions = '<div class="btn-row" style="margin-top:6px"><button class="btn small" data-ser-cancel="' + req.id + '">요청 취소</button></div>';
    } else if (mode === "mine" && req.status === "APPROVED" && (req.action === "UPDATE" || req.action === "DELETE")) {
      // 이미 반영된 수정/삭제라도 원래 값으로 되돌리고 싶을 수 있어 — 되돌리기도 새 승인 요청(건설팀
      // 담당자 승인 필요)으로 접수한다. 직접 DB에 반영하지 않는다.
      actions = '<div class="btn-row" style="margin-top:6px"><button class="btn small" data-ser-revert="' + req.id + '">이전 값으로 복원 요청</button></div>';
    }
    return (
      '<div class="filter-bar" style="align-items:flex-start;flex-direction:column;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--surface-2)">' +
        '<div style="display:flex;justify-content:space-between;width:100%;gap:8px;flex-wrap:wrap"><div style="font-size:12.5px">' + meta + "</div>" + chip + "</div>" +
        '<div style="font-size:12.5px;margin-top:4px">' + specEntryRequestSummary(req) + "</div>" +
        decided + actions +
      "</div>"
    );
  }
  function wireSpecEntryRequestActions(main, owner) {
    Array.prototype.forEach.call(main.querySelectorAll("[data-ser-approve]"), function (b) {
      b.onclick = function () {
        var req = state.specEntryRequests.filter(function (r) { return r.id === b.dataset.serApprove; })[0];
        if (!req) return;
        b.disabled = true;
        approveSpecEntryRequest(req, owner).then(render).catch(function (e) { b.disabled = false; alert("승인 실패: " + (e && e.message ? e.message : e)); });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-ser-reject]"), function (b) {
      b.onclick = function () {
        var req = state.specEntryRequests.filter(function (r) { return r.id === b.dataset.serReject; })[0];
        if (!req) return;
        var note = prompt("반려 사유를 입력해 주세요(선택 — 기술팀 담당자에게 그대로 보여집니다):") || "";
        b.disabled = true;
        rejectSpecEntryRequest(req, owner, note).then(render).catch(function (e) { b.disabled = false; alert("반려 실패: " + (e && e.message ? e.message : e)); });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-ser-cancel]"), function (b) {
      withConfirmClick(b, "정말 취소? (다시 클릭)", function () {
        var req = state.specEntryRequests.filter(function (r) { return r.id === b.dataset.serCancel; })[0];
        if (!req) return;
        b.disabled = true;
        cancelSpecEntryRequest(req).then(render).catch(function (e) { b.disabled = false; alert("취소 실패: " + (e && e.message ? e.message : e)); });
      });
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-ser-revert]"), function (b) {
      withConfirmClick(b, "건설팀 승인 요청? (다시 클릭)", function () {
        var req = state.specEntryRequests.filter(function (r) { return r.id === b.dataset.serRevert; })[0];
        if (!req) return;
        b.disabled = true;
        requestRevertSpecEntry(req, owner).then(render).catch(function (e) { b.disabled = false; alert("복원 요청 실패: " + (e && e.message ? e.message : e)); });
      });
    });
  }
  // TECH_LEAD("내 요청 현황")·ADMIN("전체 승인 대기") 화면 하단에 붙는 공용 패널
  function renderSpecEntryRequestsSection(owner) {
    if (owner.role === "TECH_LEAD") {
      var mine = state.specEntryRequests.filter(function (r) { return r.requestedById === owner.id; })
        .sort(function (a, b) { return (b.requestedAt || "").localeCompare(a.requestedAt || ""); }).slice(0, 20);
      return '<div class="panel"><h2>내 요청 현황</h2>' +
        (mine.length ? mine.map(function (r) { return renderSpecEntryRequestCard(r, "mine"); }).join("") : '<p class="auto-note">아직 제출한 요청이 없습니다.</p>') +
      "</div>";
    }
    if (owner.role === "ADMIN") {
      var pending = specEntryRequestsForApprover(owner);
      return '<div class="panel"><h2>전체 승인 대기 (' + pending.length + "건) — 기술팀 제출분</h2>" +
        (pending.length ? pending.map(function (r) { return renderSpecEntryRequestCard(r, "review"); }).join("") : '<p class="auto-note">승인 대기 중인 요청이 없습니다.</p>') +
      "</div>";
    }
    return "";
  }
  // 건설팀 담당자 전용 — 입력 화면 없이 승인 대기 검토만 한다
  function renderSpecEntryApprovalOnlyPage(main, owner) {
    var pending = specEntryRequestsForApprover(owner);
    var history = state.specEntryRequests.filter(function (r) { return r.status !== "PENDING" && (owner.majorProcesses || []).indexOf(r.dept) !== -1; })
      .sort(function (a, b) { return (b.decidedAt || "").localeCompare(a.decidedAt || ""); }).slice(0, 30);
    main.innerHTML =
      '<div class="page">' +
        '<h1 style="font-size:19px;margin-bottom:4px">제원 수기입력 — 승인 대기</h1>' +
        '<p style="font-size:12.5px;color:var(--ink-muted);margin:0 0 16px">기술팀 담당자가 "제원 수기입력" 탭에서 제출한 추가·수정·삭제 요청 중, 담당 대공정(' + esc((owner.majorProcesses || []).join(", ") || "미지정") + ')에 해당하는 요청입니다. <b>승인</b>하면 그 자리에서 제원 DB에 반영되고, <b>반려</b>하면 DB는 바뀌지 않고 기술팀에게 반려 상태로 보여집니다.</p>' +
        '<div class="panel"><h2>승인 대기 (' + pending.length + "건)</h2>" +
          (pending.length ? pending.map(function (r) { return renderSpecEntryRequestCard(r, "review"); }).join("") : '<div class="empty-state"><div class="big">✅</div>승인 대기 중인 요청이 없습니다.</div>') +
        "</div>" +
        '<div class="panel"><h2>최근 처리 이력</h2>' +
          (history.length ? history.map(function (r) { return renderSpecEntryRequestCard(r, "none"); }).join("") : '<p class="auto-note">아직 처리한 요청이 없습니다.</p>') +
        "</div>" +
      "</div>";
    wireSpecEntryRequestActions(main, owner);
  }
  // 항목 한 건을 편집 가능한 입력들로 렌더링 — 대분류 스키마가 있으면 그 필드 구성을, 없으면(예: 표준
  // 대분류를 벗어난 옛 업로드 데이터) 있는 필드를 모두 보여준다. isDirect가 false(기술팀)면 저장/삭제가
  // 곧장 반영되지 않고 승인 요청을 만들 뿐이라 버튼 문구를 "…요청"으로 바꾸고, 이미 이 항목에 대한
  // 승인 대기 요청이 있으면(pendingReq) 중복 요청을 막기 위해 버튼을 비활성화하고 그 내용을 보여준다.
  function renderSpecEntryItemRow(idx, it, pendingReq, isDirect) {
    var schema = CATEGORY_ITEM_SCHEMA[it.category];
    var keyField = schema ? schema.keyField : (itemKeyField(it).name || "성상명");
    var keyOptions = schema ? categoryKeyOptions(it.category) : null;
    var fieldList = schema ? schema.fields : SPEC_FIELDS.filter(function (f) { return it[f] != null; });
    var keyVal = it[keyField];
    var keyControl = keyOptions
      ? standardSelectHtml(keyField, keyOptions, keyVal, "text se-input")
      : '<input class="text se-input" data-field="' + esc(keyField) + '" value="' + esc(keyVal == null ? "" : keyVal) + '">';
    var fieldControls = fieldList.map(function (f) {
      var v = it[f];
      return '<div class="field"><label class="field-label">' + esc(f) + '</label><input class="text se-input" data-field="' + esc(f) + '" value="' + esc(v == null ? "" : v) + '"></div>';
    }).join("");
    var pendingNote = pendingReq

                '<div class="field grow"><label class="field-label">제목</label><input class="text" id="seNewTitle" placeholder="예: ' + esc(deptVal || "") + ' 장비 제원표" value="' + esc(form.newTitle) + '"></div>' +

    function resetNewCodeFields() { form.newCodeValue = ""; form.newPjt = ""; form.newTitle = ""; form.newLocation = ""; }

  function wireSpecEntryEvents(main, deptVal, codeVal, form, sheet, owner, isDirect) {
    Array.prototype.forEach.call(main.querySelectorAll("[data-se-save]"), function (b) {
      b.onclick = function () {
        var idx = +b.dataset.seSave;
        var row = main.querySelector('[data-se-row="' + idx + '"]');
        var vals = readSpecEntryInputs(row);
        var currentItem = (sheet && (sheet.items || [])[idx]) || {};
        var changes = specEntryDiffChanges(currentItem, vals);
        var errEl = document.getElementById("seError"); errEl.innerHTML = "";
        if (!Object.keys(changes).length) { errEl.innerHTML = '<p class="error-text">변경된 값이 없습니다.</p>'; return; }
        b.disabled = true;
        var action = isDirect ? specEntryUpdateItemDirect(codeVal, idx, changes) : specEntryRequestUpdate(codeVal, idx, changes, owner, sheet);
        action.then(function () { render(); }).catch(function (e) {
          b.disabled = false;
          errEl.innerHTML = '<p class="error-text">' + (isDirect ? "저장" : "요청") + " 실패: " + esc(e && e.message ? e.message : e) + "</p>";
        });
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll("[data-se-delete]"), function (b) {
      withConfirmClick(b, isDirect ? "정말 삭제? (다시 클릭)" : "정말 삭제 요청? (다시 클릭)", function () {
        var idx = +b.dataset.seDelete;
        var errEl = document.getElementById("seError"); errEl.innerHTML = "";
        b.disabled = true;
        var action = isDirect ? specEntryDeleteItemDirect(codeVal, idx) : specEntryRequestDelete(codeVal, idx, owner, sheet);
        action.then(function () { render(); }).catch(function (e) {
          b.disabled = false;
          errEl.innerHTML = '<p class="error-text">' + (isDirect ? "삭제" : "요청") + " 실패: " + esc(e && e.message ? e.message : e) + "</p>";
        });
      });
    });
    var addBtn = document.getElementById("seAddItemBtn");
    if (addBtn) addBtn.onclick = function () {
      var errEl = document.getElementById("seAddError"); errEl.innerHTML = "";
      var category = form.category;
      var schema = CATEGORY_ITEM_SCHEMA[category];
      if (!schema) return;
      var keyEl = document.getElementById("seNewKey");
      var keyVal = (keyEl.value || "").trim();
      if (!keyVal) { errEl.innerHTML = '<p class="error-text">' + esc(schema.keyField) + "을(를) 입력해 주세요.</p>"; return; }
      var newItem = { category: category };
      newItem[schema.keyField] = coerceValue(keyVal);
      Array.prototype.forEach.call(main.querySelectorAll(".se-new-field"), function (el) {
        var v = (el.value || "").trim();
        if (v !== "") newItem[el.dataset.field] = coerceValue(v);
      });
      var moduleVal = (document.getElementById("seNewModule").value || "").trim();
      if (moduleVal) newItem.설비모듈 = moduleVal;
      var equipRaw = (document.getElementById("seNewEquip").value || "").trim();
      newItem.설비대수 = equipRaw === "" ? 1 : coerceValue(equipRaw);

      var codeToUse, sheetPatchBase, isNewCode = !!form.isNewCode;
      if (form.isNewCode) {
        var newCodeVal = (document.getElementById("seNewCodeValue").value || "").trim().toUpperCase();
        if (!newCodeVal) { errEl.innerHTML = '<p class="error-text">건설코드를 입력해 주세요.</p>'; return; }
        if (state.sheets[newCodeVal]) { errEl.innerHTML = '<p class="error-text">이미 존재하는 건설코드입니다. 위에서 그 건설코드를 선택해 항목을 추가해 주세요.</p>'; return; }
        codeToUse = newCodeVal;
        sheetPatchBase = {
          code: newCodeVal, dept: deptVal,
          title: (document.getElementById("seNewTitle").value || "").trim() || (deptVal + " " + newCodeVal),
          location: (document.getElementById("seNewLocation").value || "").trim(),
          pjt: document.getElementById("seNewPjt").value, items: [],
        };
      } else {
        if (!codeVal) { errEl.innerHTML = '<p class="error-text">건설코드를 선택해 주세요.</p>'; return; }
        codeToUse = codeVal;
        sheetPatchBase = Object.assign({}, sheet);
      }
      addBtn.disabled = true;
      var action = isDirect
        ? specEntryAddItemDirect(codeToUse, sheetPatchBase, newItem)
        : specEntryRequestAdd(codeToUse, deptVal, sheetPatchBase, newItem, isNewCode, owner);
      action.then(function () {
        form.category = "";
        if (isDirect) {
          form.isNewCode = false; form.code = codeToUse;
          form.newCodeValue = ""; form.newPjt = ""; form.newTitle = ""; form.newLocation = "";
        } // 승인 대기 상태에서는(비관리자) 같은 신규 건설코드에 항목을 더 추가할 수 있도록 폼을 유지한다
        render();
      }).catch(function (e) {
        addBtn.disabled = false;
        errEl.innerHTML = '<p class="error-text">' + (isDirect ? "추가" : "요청") + " 실패: " + esc(e && e.message ? e.message : e) + "</p>";
      });
    };
    wireSpecEntryRequestActions(main, owner);
  }

  function renderOwnersPage(main) {
    var owners = state.owners.slice().sort(function (a, b) { return a.name.localeCompare(b.name, "ko"); });

        '<div class="owners-grid">' +

  // ===================================================================
  // 제원표 상세

  var SHEET_TABS = [

  function renderSheetPage(main) {
    var codes = sheetList().map(function (s) { return s.code; }).sort();
    if (state.selectedSheet && codes.indexOf(state.selectedSheet) === -1 && state.sheets[state.selectedSheet]) {
      codes = codes.concat([state.selectedSheet]).sort();
    }
    var code = state.selectedSheet || codes[0];

        '<div class="panel" style="padding:0">' +
          '<div class="workspace-head"><div><h1>' + esc(sheet.title || code) + "</h1><div class=\"meta\"><span class=\"num\">" + code + '</span><span class="chip neutral">v' + (sheet.ver || 1) + '</span>' + (sheet.pjt ? '<span class="sep">·</span><span class="chip type-AUTO">' + esc(sheet.pjt) + "</span>" : "") + '<span class="sep">·</span><span>' + esc(sheet.location || "") + '</span><span class="sep">·</span><span class="chip dept">' + esc(sheet.dept) + "</span>" +
            (errorCount ? '<span class="chip error">OVER ' + errorCount + "건</span>" : '<span class="chip ok">기준 이내</span>') +
            (sheetApplied(sheet) ? "" : ' <span class="chip warn" title="관리자가 \'제원표 업로드\' 탭에서 미적용으로 전환해, 대시보드·제원 DB·집계·질의 등 다른 모든 화면에서 제외되어 있습니다">미적용</span>') +
            "</div></div></div>" +
          '<div class="tabs">' + SHEET_TABS.map(function (t) {

              : state.activeTab === "qa" ? renderRelatedQaTab(relatedThreads, code)
              : state.activeTab === "versions" ? renderVersionsTab(sheet)

          "</div>" +
        "</div>" +
      "</div>";

    Array.prototype.forEach.call(main.querySelectorAll("[data-goto-sheet]"), function (b) { b.onclick = function () { state.selectedSheet = b.dataset.gotoSheet; state.activeTab = "items"; state.composerFor = null; state.newQueryOpen = false; render(); }; });
    Array.prototype.forEach.call(main.querySelectorAll(".tab"), function (b) { b.onclick = function () { state.activeTab = b.dataset.tab; state.composerFor = null; state.newQueryOpen = false; render(); }; });
    wireSheetTabEvents(main, code, issues, items);
    wireVersionsTabEvents(main);
  }
  function renderItemsTab(items, issues, sheetCode) {
    var flagByItem = {};
    issues.forEach(function (i) { var cur = flagByItem[i.itemIdx]; if (!cur || i.severity === "ERROR") flagByItem[i.itemIdx] = i.severity; });
    var byCat = {};
    items.forEach(function (it, idx) { (byCat[it.category] = byCat[it.category] || []).push({ it: it, idx: idx }); });
    return CAT_ORDER.filter(function (c) { return byCat[c]; }).map(function (category) {
      var rows = byCat[category].map(function (pair) {
        var it = pair.it, idx = pair.idx;
        var key = itemKeyField(it);
        var specBits = [];
        SPEC_FIELDS.concat(["설비모듈", "설비대수"]).forEach(function (f) {
          if (it[f] == null) return;
          var valHtml = (typeof it[f] === "number" ? fmtNum(it[f]) : esc(it[f]));
          specBits.push(specEditSpan(sheetCode, idx, f, f + " <b>" + valHtml + "</b>"));
        });
        var flag = flagByItem[idx];
        var keyHtml = key.name ? specEditSpan(sheetCode, idx, key.name, esc(key.value)) : esc(key.value);
        return '<div class="item-row' + (flag ? " flagged-" + flag : "") + '"><span class="key">' + keyHtml + '</span><div class="specs">' + specBits.join("") + "</div></div>";
      }).join("");
      return '<div class="item-group"><div class="cat-label"><span class="swatch"></span>' + category + " · " + byCat[category].length + "건</div>" + rows + "</div>";
    }).join("") || '<div class="empty-state">항목이 없습니다.</div>';
  }
  function renderIssuesTab(issues, items, sheetCode) {
    if (issues.length === 0) return '<div class="empty-state"><div class="big">✓</div>검증 규칙(성상별 유량 OVER, 성상명 표준화)을 통과했습니다.</div>';
    return issues.map(function (issue) {
      var it = items[issue.itemIdx];
      var existingAuto = issue.suggestedValue && state.threads.some(function (t) { return t.queryType === "AUTO" && (t.targets || []).some(function (tg) { return tg.sheetCode === sheetCode && tg.itemIdx === issue.itemIdx && tg.field === issue.field; }) && t.status !== "REJECTED"; });
      var existingManual = state.threads.filter(function (t) { return t.queryType === "MANUAL" && (t.targets || []).some(function (tg) { return tg.sheetCode === sheetCode && tg.itemIdx === issue.itemIdx && tg.field === issue.field; }); })[0];
      var actionHtml;
      if (issue.suggestedValue) {
        actionHtml = existingAuto
          ? '<span class="chip type-AUTO">자동 질의 등록됨</span>'
          : '<span class="chip type-AUTO">자동 질의 대상</span>';
      } else if (existingManual) {
        actionHtml = '<button class="btn small" data-goto-manual="' + existingManual.id + '">' + QA_STATUS_LABEL[existingManual.status] + " · 보기</button>";
      } else {
        actionHtml = '<button class="btn small primary" data-ask="' + issue.id + '">질문하기</button>';
      }
      return (
        '<div class="issue-card ' + issue.severity + '">' +
          '<div class="body"><div class="msg">' + esc(issue.message) + "</div>" +
          '<div class="sub">' + it.category + " · " + issue.field + " 필드 · 행 #" + (issue.itemIdx + 1) + "</div>" +
          (issue.suggestedValue ? '<div class="suggest">제안값: ' + esc(issue.suggestedValue) + ' → "질의응답" 메뉴의 "자동 질의 일괄 생성"으로 처리하세요.</div>' : "") +
          (state.composerFor === issue.id ? renderComposer(issue) : "") + "</div>" +
          '<div class="actions">' + actionHtml + "</div>" +
        "</div>"
      );
    }).join("");
  }
  function renderComposer(issue) {
    return (
      '<div class="thread-form" style="margin-top:10px">' +
        '<textarea rows="2" id="composerText" data-issue="' + issue.id + '">' + esc("이 값이 맞는지 확인 부탁드립니다. (" + issue.message + ")") + "</textarea>" +
        '<div class="row"><select id="composerDiscipline">' + DISCIPLINES.map(function (d) { return '<option value="' + d.code + '">' + d.name + "</option>"; }).join("") + "</select></div>" +
        '<div class="row"><button class="btn primary small" data-submit-question="' + issue.id + '">질문 등록</button><button class="btn small" data-cancel-question="1">취소</button></div>' +
      "</div>"
    );
  }
  function renderAggTab(agg) {
    if (agg.length === 0) return '<div class="empty-state">집계할 데이터가 없습니다.</div>';
    return '<div class="agg-grid">' + agg.map(renderAggCard).join("") + "</div>";
  }
  function renderRelatedQaTab(threads, code) {
    var listHtml = !threads.length
      ? '<div class="empty-state"><div class="big">💬</div>이 제원표와 관련된 질의가 없습니다. "검증 결과" 탭의 이슈에서 질문을 등록하거나, "질의응답" 메뉴에서 자동 질의를 생성해 보세요.</div>'
      : threads.map(function (t) {
          return (
            '<div class="thread-card" data-goto-manual="' + t.id + '" style="cursor:pointer">' +
              '<span class="chip ' + QA_STATUS_CHIP[t.status] + '">' + QA_STATUS_LABEL[t.status] + '</span> <span class="chip type-' + t.queryType + '">' + (t.queryType === "AUTO" ? "자동" : "수동") + "</span>" +
              (queryNature(t) === "NON_SPEC" ? ' <span class="chip neutral">일반(제원무관)</span>' : "") +
              '<div class="t-title">' + esc(t.title) + "</div>" +
              '<div class="t-meta">담당: ' + esc(t.assignedOwnerName || "미배정") + "</div>" +
            "</div>"
          );
        }).join("") + '<p class="auto-note" style="margin-top:8px">답변/승인 등 실제 처리는 상단 "질의응답" 메뉴에서 진행합니다.</p>';
    // ---- 제원 DB 값과 무관한 일반 문의(NON_SPEC) 등록 — 특정 필드를 지정하지 않고 이 제원표에 대해
    // 자유롭게 서술형으로 질문만 남긴다. 기술팀 서술형 답변 → 설계사 최종검증만으로 처리된다. ----
    var composerHtml = state.newQueryOpen
      ? (
          '<div class="thread-form" style="margin-top:10px">' +
            '<label class="field-label">일반 질의 등록 (제원 DB 값을 바꾸는 것과 무관한 문의)</label>' +
            '<textarea rows="2" id="generalQuestionText" placeholder="예: 이 항목의 시공 방법/현장 여건을 확인해 주세요."></textarea>' +
            '<div class="row"><select id="generalQuestionDiscipline">' + DISCIPLINES.map(function (d) { return '<option value="' + d.code + '">' + d.name + "</option>"; }).join("") + "</select></div>" +
            '<div class="row"><button class="btn primary small" data-submit-general-question="' + esc(code) + '">질문 등록</button><button class="btn small" data-cancel-general-question="1">취소</button></div>' +
          "</div>"
        )
      : '<div class="btn-row" style="margin-top:10px"><button class="btn small" id="openGeneralQuestionBtn">+ 일반 질의 등록 (제원과 무관)</button></div>';
    return listHtml + composerHtml;
  }
  function renderCorrectionsTab(corrections) {
    if (!corrections.length) return '<div class="empty-state"><div class="big">🗂</div>아직 반영된 수정 이력이 없습니다.</div>';
    var rows = corrections.map(function (c) {
      return "<tr><td>" + esc(c.field) + '</td><td><span class="old">' + esc(c.oldValue) + '</span><span class="arrow">→</span><span class="new">' + esc(c.newValue) + "</span></td><td><span class=\"chip type-" + (c.source === "AUTO" ? "AUTO" : "MANUAL") + '">' + (c.source === "AUTO" ? "자동" : c.source === "MANUAL_ENTRY" ? "수기입력" : "수동") + "</span></td><td>" + esc(c.appliedBy) + "</td><td>" + fmtTime(c.appliedAt) + "</td></tr>";
    }).join("");

  function versionSourceLabel(src) {
    return src === "SEED" ? "시드 데이터" : src === "UPLOAD" ? "엑셀 업로드(누적)" : src === "AUTO" ? "자동 질의 반영" : src === "MANUAL" ? "수동 질의 반영" : src === "MANUAL_ENTRY" ? "기술팀 수기입력" : (src || "-");
  }
  function renderVersionsTab(sheet) {
    var history = sheet.versionHistory || [];
    var current =
      '<div class="thread-card" style="cursor:default"><span class="chip ok">v' + (sheet.ver || 1) + " · 현재</span> <span class=\"chip type-" +
        (sheet.versionSource === "UPLOAD" || sheet.versionSource === "MANUAL_ENTRY" ? "MANUAL" : "AUTO") + '">' + esc(versionSourceLabel(sheet.versionSource)) + "</span>" +
        '<div class="t-meta" style="margin-top:6px">' + (sheet.items || []).length + "건 · " + fmtTime(sheet.updatedAt) + "</div></div>";
    if (!history.length) {
      return current + '<p class="auto-note" style="margin-top:10px">이전 버전이 없습니다. 이 제원표가 재업로드되거나 질의 승인으로 값이 바뀌면 이전 상태가 여기 버전 이력으로 남습니다.</p>';

          '<div class="row2"><span class="chip neutral">v' + v.ver + '</span> <button class="btn small" data-toggle-version="' + v.ver + '">' + (expanded ? "접기" : "항목 보기") + "</button></div>" +
          '<div class="t-meta" style="margin-top:6px">' + esc(versionSourceLabel(v.versionSource)) + " · " + (v.items || []).length + "건 · " + fmtTime(v.archivedAt) + "</div>" +
          (expanded ? '<div style="margin-top:10px">' + renderItemsTab(v.items || [], []) + "</div>" : "") +
        "</div>"
      );
    }).join("");
    return current + '<div style="margin-top:10px">' + rows + "</div>";
  }
  function wireSheetTabEvents(main, code, issues, items) {
    Array.prototype.forEach.call(main.querySelectorAll("[data-ask]"), function (b) { b.onclick = function () { state.composerFor = b.dataset.ask; render(); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-cancel-question]"), function (b) { b.onclick = function () { state.composerFor = null; render(); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-goto-manual]"), function (b) { b.onclick = function () { state.page = "queries"; state.selectedThreadId = b.dataset.gotoManual; render(); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-submit-question]"), function (b) {
      b.onclick = function () {
        var issueId = b.dataset.submitQuestion;
        var issue = issues.filter(function (i) { return i.id === issueId; })[0];
        var content = (document.getElementById("composerText").value || "").trim();
        var discipline = document.getElementById("composerDiscipline").value;
        if (!content) return;
        var owner = currentOwner();
        var sheet = state.sheets[code];
        b.disabled = true;
        store.addThread({
          queryType: "MANUAL", queryNature: "SPEC", pjt: sheet.pjt, majorProcess: sheet.dept, discipline: discipline, fieldLabel: issue.field,
          asIsValue: String(items[issue.itemIdx][issue.field]), toBeValue: null,
          targets: [{ sheetCode: code, itemIdx: issue.itemIdx, field: issue.field }], status: "OPEN",
          title: "[문의] " + issue.field + " (" + code + ")", question: content,
          createdBy: owner ? owner.name : "익명", createdAt: nowIso(), updatedAt: nowIso(),
          assignedOwnerName: pickTechLeadFor(sheet.dept), messages: [],
        }).then(function () { state.composerFor = null; render(); });
      };
    });
    var openGeneralBtn = main.querySelector("#openGeneralQuestionBtn");
    if (openGeneralBtn) openGeneralBtn.onclick = function () { state.newQueryOpen = true; render(); };
    Array.prototype.forEach.call(main.querySelectorAll("[data-cancel-general-question]"), function (b) { b.onclick = function () { state.newQueryOpen = false; render(); }; });
    Array.prototype.forEach.call(main.querySelectorAll("[data-submit-general-question]"), function (b) {
      b.onclick = function () {
        var content = (document.getElementById("generalQuestionText").value || "").trim();
        var discipline = document.getElementById("generalQuestionDiscipline").value;

        b.disabled = true;
        store.addThread({
          queryType: "MANUAL", queryNature: "NON_SPEC", pjt: sheet.pjt, majorProcess: sheet.dept, discipline: discipline, fieldLabel: null,
          asIsValue: null, toBeValue: null,
          targets: [{ sheetCode: code, itemIdx: null, field: null }], status: "OPEN",
          title: "[일반 문의] " + code, question: content,
          createdBy: owner ? owner.name : "익명", createdAt: nowIso(), updatedAt: nowIso(),
          assignedOwnerName: pickTechLeadFor(sheet.dept), messages: [],
        }).then(function () { state.newQueryOpen = false; render(); });
      };
    });
  }
  function wireVersionsTabEvents(main) {
    Array.prototype.forEach.call(main.querySelectorAll("[data-toggle-version]"), function (b) {
      b.onclick = function () {
        var v = +b.dataset.toggleVersion;
        state.expandedVersion = state.expandedVersion === v ? null : v;
        render();
      };
    });
  }

  // ===================================================================
  // 부팅 / 실시간 구독 — 지침: DB(owners/spec_sheets/qa_threads/corrections/spec_entry_requests) 값이
  // 바뀌면 대시보드·제원 DB·SUMMARY·질의응답 등 모든 탭이 항상 자동으로 다시 그려지도록 유지한다.
  // 아래 5개 컬렉션 리스너가 각각 render()를 호출하고, 모든 페이지 렌더 함수(renderDashboard,
  // renderDbPage, computeSummary, renderQueriesPage 등)는 그때그때 state.sheets/state.threads/
  // state.corrections/state.specEntryRequests를 그대로 다시 읽어 계산한다 — 페이지별로 값을 캐시해
  // 두지 않는다. 새 탭이나 계산을 추가할 때도 이 원칙(캐시 없이 state에서 매번 새로 계산)을 지켜야
  // 탭 간 값이 어긋나지 않는다.
  // ===================================================================
  // GCS 성질분류 맵핑리스트에 없는 신규 값이 sheets에 나타날 때마다 자동으로 질의를 생성한다(중복
  // 실행 방지용 잠금 플래그 — store.addThread가 다시 watchThreads를 통해 render()를 부르긴 해도
  // watchSheets를 다시 부르지는 않으므로 무한루프는 없다. 동시에 여러 번 겹쳐 불리는 것만 막는다).
  var gcsNatureGenBusy = false;
  function maybeGenerateGcsNatureQueries() {
    if (gcsNatureGenBusy) return;
    gcsNatureGenBusy = true;
    generateGcsNatureQueries().catch(function () {}).then(function () { gcsNatureGenBusy = false; });
  }
  var unsubs = [];
  function subscribeAll() {
    unsubs.forEach(function (u) { u(); });
    unsubs = [
      store.watchOwners(function (docs) { state.owners = docs; render(); }),
      store.watchSheets(function (map) { state.sheets = map; render(); maybeGenerateGcsNatureQueries(); }),
      store.watchThreads(function (docs) { state.threads = docs; render(); }),
      store.watchCorrections(function (docs) { state.corrections = docs; render(); }),
      store.watchSpecEntryRequests(function (docs) { state.specEntryRequests = docs; render(); }),
      store.watchGuideConfig(function (doc) { state.guideConfig = doc; render(); }),
    ];
  }
  function setLive(on, label) {
    var pill = document.getElementById("livePill");
    pill.classList.toggle("on", on);
    document.getElementById("liveLabel").textContent = label;
  }
  function boot(dbNs) {
    db = dbNs;
    store = makeDbStore(dbNs);
    setLive(true, "실시간 공유 연결됨");
    seedIfEmpty();
    subscribeAll();
    render();
  }

  function render() {
    renderPjtSelect();
    renderUserSelect();
    renderPageNav();
    var main = document.getElementById("mainArea");
    if (state.page === "guide") renderGuidePage(main);
    else if (state.page === "myTasks") renderMyTasksPage(main);
    else if (state.page === "dashboard") renderDashboard(main);
    else if (state.page === "db") renderDbPage(main);
    else if (state.page === "pivot") renderPivotPage(main);
    else if (state.page === "summary") renderSummaryPage(main);
    else if (state.page === "queries") renderQueriesPage(main);
    else if (state.page === "manualQuery") renderManualQueryPage(main);
    else if (state.page === "upload") renderUploadPage(main);
    else if (state.page === "specEntry") renderSpecEntryPage(main);
    else if (state.page === "owners") renderOwnersPage(main);
    else if (state.page === "sheet") renderSheetPage(main);
    renderChatWidget(); // 우측 하단 AI 챗봇 — 어느 탭이든 항상 떠 있어야 하므로 페이지 분기와 무관하게 매번 다시 그린다
  }
